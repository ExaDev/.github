name: Sibling dependency instant update

# Reusable workflow shared by every repo in the documents.js ecosystem (and any other ExaDev repo with sibling npm dependencies on ExaDev-published packages). A caller repo's own thin stub triggers this on repository_dispatch (sent by a sibling package's own CI the moment it publishes -- see that package's "Notify downstream repositories" job), on push to main (to heal any sibling-update PR that fell behind), and on workflow_dispatch (manual trigger, and the entry point sync-ecosystem.yml uses when firing a dispatch programmatically). A called reusable workflow receives the exact same github.event/github.event_name as its caller (GitHub Actions propagates the calling workflow's full event payload into workflow_call jobs), so github.event.client_payload and the event_name gates below behave identically to when this logic lived directly in each repo.
#
# The branch push and the PR-open call both authenticate via a freshly-minted GitHub App installation token, not the default GITHUB_TOKEN -- GITHUB_TOKEN-authenticated actions (a push OR opening a PR) do not cascade into further workflow runs, so a GITHUB_TOKEN-created PR would never trigger the caller repo's own CI pull_request checks at all, leaving nothing for the merge step below to wait on.
#
# Even with the App token making that cascade happen for real, GitHub can take a few seconds to register the caller repo's CI check-runs against the new PR's commit at all. The "wait for CI checks" step first polls until at least one check-run has appeared against the head commit, and only then starts polling for every check-run to reach a conclusion -- skipping that first wait would read an empty check-run list as "nothing pending, nothing failed" and merge before CI ever ran.
#
# Both bump sites -- the dispatch handler and the heal path's regeneration -- are idempotent by version ordering, not by diff presence: pnpm add only runs when the named version is strictly above what the default branch already pins for the package (package.json's current spec across its dependency tables, range caret stripped -- the form pnpm add itself writes). A no-op guarded on diff presence catches only an exact replay; a named version below current main still diffs -- a downgrade diffs as readily as an upgrade -- and the PR it opens is a downgrade the wait-for-green gate will merge as happily as any upgrade.
#
# This workflow never pushes directly to main -- the PR only merges once the caller repo's own required checks genuinely pass on it, and (when branch protection is configured with required status checks) GitHub itself refuses the merge until they do, independent of this script's own polling logic being correct.

on:
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-and-open-pr:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Bump the released dependency, unless main already holds it or newer
        env:
          PACKAGE: ${{ github.event.client_payload.package }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          # Idempotence guard, checked before the add: the checkout is the default branch, so main's current spec for the package is the floor, and a named version at or below it is a no-op -- equal is a replay of an already-merged bump, below is a backport published after a newer release -- because re-running pnpm add in either case still produces a diff, and the PR that diff opens sails through the wait-for-green gate as a downgrade. Compared on the bare version (range caret stripped), the spec form pnpm add itself writes; dependencies merges last so a dual-table pin resolves to the spec pnpm add will actually rewrite.
          floor=$(jq -r --arg p "$PACKAGE" '(.devDependencies // {}) * (.optionalDependencies // {}) * (.peerDependencies // {}) * (.dependencies // {}) | .[$p] // empty' package.json | tr -d '^~')
          if [ -n "$floor" ] && [ "$VERSION" = "$(printf '%s\n%s\n' "$floor" "$VERSION" | sort -V | head -n1)" ]; then
            echo "main already holds ${PACKAGE}@${floor} -- ${VERSION} is at or below it. Nothing to bump."
            exit 0
          fi
          pnpm add "$PACKAGE@$VERSION"
      - name: Check whether anything actually changed
        id: diff
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate a token for the branch push and PR
        if: steps.diff.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: "4473709"
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Commit and open a PR
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGE: ${{ github.event.client_payload.package }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="sibling-update/${PACKAGE}-${VERSION}"
          git checkout -b "$branch"
          git add package.json pnpm-lock.yaml
          body=$(printf 'Triggered instantly via repository_dispatch when %s published its own release,\nrather than waiting for the next scheduled Dependabot scan.' "$PACKAGE")
          git commit -m "build(deps): bump ${PACKAGE} to ${VERSION}" -m "$body"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "$branch"
          pr_url=$(gh pr create --title "build(deps): bump ${PACKAGE} to ${VERSION}" --body "Automatic dependency bump triggered instantly by the ${PACKAGE} release." --base main --head "$branch")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for a check-run to register against the new commit
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          head_sha="${{ steps.pr.outputs.head_sha }}"
          repo="${{ github.repository }}"
          for _attempt in $(seq 1 30); do
            found=$(gh api "repos/${repo}/commits/${head_sha}/check-runs" --jq '[.check_runs[] | select(.name == "Test")] | length')
            if [ "$found" -gt 0 ]; then
              echo "Test check-run has registered."
              exit 0
            fi
            sleep 3
          done
          echo "::warning::No 'Test' check-run registered within 90 seconds. Proceeding to poll anyway -- the polling loop below still treats an empty check-run list as nothing-pending, so this is a best-effort guard, not a hard requirement."
      - name: Wait for all CI checks to pass, then rebase-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_url="${{ steps.pr.outputs.pr_url }}"
          head_sha="${{ steps.pr.outputs.head_sha }}"
          repo="${{ github.repository }}"
          for _attempt in $(seq 1 90); do
            pending=$(gh api "repos/${repo}/commits/${head_sha}/check-runs" --paginate --jq '[.check_runs[] | select(.conclusion == null)] | length')
            if [ "$pending" -eq 0 ]; then
              failed=$(gh api "repos/${repo}/commits/${head_sha}/check-runs" --paginate --jq '[.check_runs[] | select(.conclusion != "success" and .conclusion != "skipped")] | length')
              if [ "$failed" -gt 0 ]; then
                echo "::error::CI checks failed on this sibling-update PR. Leaving it open for manual review."
                exit 1
              fi
              echo "All CI checks passed. Rebase-merging."
              gh pr merge --rebase "$pr_url"
              exit 0
            fi
            echo "Waiting for ${pending} CI check(s) to complete..."
            sleep 20
          done
          echo "::warning::CI did not complete within 30 minutes. PR left open for manual merge." >&2

  heal-stranded-prs:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: "4473709"
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Regenerate every conflicting sibling-update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # One PR's failure must never abort the rest of the batch -- this whole body previously ran under bash's default errexit (set -e, GitHub Actions' default for `run:` steps), so a single `gh pr create` failure (e.g. "a pull request for branch ... already exists", a genuine race against a concurrent dispatch or another heal-stranded-prs run touching the same branch) killed the entire step immediately, silently abandoning every other stranded PR still queued in this run. Confirmed happening in production on 2026-08-12 -- a real, growing backlog of 20+ stranded PRs accumulated across the family because every run died on the first conflict. regenerate_pr is called inside an `if`, which suppresses errexit for that call, so a nonzero return here only ends this one PR's processing, not the loop.
          #
          # Shared by both healing paths below: waits for a check-run to register against head_sha, then polls until every check-run concludes, then rebase-merges pr_url if they all passed.
          wait_and_merge() {
            local pr_url="$1" head_sha="$2" branch="$3"

            for _attempt in $(seq 1 30); do
              local found
              found=$(gh api "repos/${{ github.repository }}/commits/${head_sha}/check-runs" \
                --jq '[.check_runs[] | select(.name == "Test")] | length')
              if [ "$found" -gt 0 ]; then
                break
              fi
              sleep 3
            done

            for _poll in $(seq 1 90); do
              local _pending
              _pending=$(gh api "repos/${{ github.repository }}/commits/${head_sha}/check-runs" --paginate --jq '[.check_runs[] | select(.conclusion == null)] | length')
              if [ "$_pending" -eq 0 ]; then
                local _failed
                _failed=$(gh api "repos/${{ github.repository }}/commits/${head_sha}/check-runs" --paginate --jq '[.check_runs[] | select(.conclusion != "success" and .conclusion != "skipped")] | length')
                if [ "$_failed" -gt 0 ]; then
                  echo "CI failed on ${branch} -- leaving it open for review"
                  return 0
                fi
                gh pr merge --rebase "$pr_url" || echo "::warning::merge of ${pr_url} failed -- leaving it open for the next heal-stranded-prs run to retry"
                return 0
              fi
              echo "Waiting for ${_pending} CI check(s) to complete on ${branch}..."
              sleep 20
            done
            echo "::warning::CI did not complete within 30 minutes for ${branch}. PR left open for manual merge or a later retry."
          }

          regenerate_pr() {
            local number="$1" branch="$2"

            local mergeable="UNKNOWN" merge_state="unknown"
            for _attempt in $(seq 1 10); do
              mergeable=$(gh pr view "$number" --json mergeable --jq '.mergeable')
              merge_state=$(gh pr view "$number" --json mergeStateStatus --jq '.mergeStateStatus')
              if [ "$mergeable" != "UNKNOWN" ]; then
                break
              fi
              sleep 3
            done

            # A PR whose branch is merely behind main (no real conflict -- required-status-checks' own "strict" mode just needs a fresh commit re-tested against the current base) never becomes CONFLICTING and so was previously invisible to this job entirely, left to sit open indefinitely with nothing watching it once the bump-and-open-pr run that created it already exited. Confirmed in production on 2026-08-12: under a sustained burst of pushes, several sibling-update PRs' own original merge-wait loop lost the race against main moving again and gave up, and nothing ever retried them since heal-stranded-prs only looked for CONFLICTING. A plain branch update (no close/regenerate) is enough here -- the content is already correct, it just needs re-validating against the new base.
            if [ "$mergeable" = "MERGEABLE" ] && [ "$merge_state" = "BEHIND" ]; then
              echo "PR #${number} (${branch}) is mergeable but behind main -- updating the branch instead of regenerating."
              gh api --method PUT "repos/${{ github.repository }}/pulls/${number}/update-branch" >/dev/null
              local pr_url head_sha
              pr_url=$(gh pr view "$number" --json url --jq '.url')
              for _attempt in $(seq 1 20); do
                local current_state
                current_state=$(gh pr view "$number" --json mergeStateStatus --jq '.mergeStateStatus')
                if [ "$current_state" != "BEHIND" ]; then
                  break
                fi
                sleep 5
              done
              head_sha=$(gh pr view "$number" --json headRefOid --jq '.headRefOid')
              wait_and_merge "$pr_url" "$head_sha" "$branch"
              return 0
            fi

            if [ "$mergeable" != "CONFLICTING" ]; then
              echo "PR #${number} (${branch}) is ${mergeable}/${merge_state}, not stranded -- skipping."
              return 0
            fi

            local package_version="${branch#sibling-update/}"
            local package="${package_version%-*}"
            local version="${package_version##*-}"
            echo "Regenerating stranded PR #${number} (${branch}) for ${package}@${version}"

            gh pr close "$number" --comment "Regenerating -- this branch fell behind main and could no longer auto-merge." || true

            git fetch origin main
            git checkout -B "$branch" origin/main

            # Idempotence guard, checked before the add: this checkout is fresh main, so main's current spec for the package is the floor, and a named version at or below it means the just-closed PR is obsolete -- equal is an already-merged bump replaying, below is a stale branch meeting a main that has since moved on (a coordinated migration landing a newer version of the same package). The old diff-only no-op guard caught only the equal case and waved the downgrade through to a green auto-merge -- confirmed in production on 2026-08-17, when a stale branch re-pinned a sibling schema dependency from ^3.0.0 back to ^2.7.17 and published the downgrade. The branch is deleted as well as the PR left closed: closed PRs are invisible to this job's candidate list, but a concurrently-running iteration that already captured the PR can still force-push the branch and reopen from it -- deletion removes that resurrection path entirely.
            local floor
            floor=$(jq -r --arg p "$package" '(.devDependencies // {}) * (.optionalDependencies // {}) * (.peerDependencies // {}) * (.dependencies // {}) | .[$p] // empty' package.json | tr -d '^~')
            if [ -n "$floor" ] && [ "$version" = "$(printf '%s\n%s\n' "$floor" "$version" | sort -V | head -n1)" ]; then
              echo "main already holds ${package}@${floor} -- ${version} is at or below it. Stale bump; PR stays closed."
              git push origin --delete "$branch" || echo "::warning::could not delete stale branch ${branch} on origin"
              return 0
            fi

            pnpm add "${package}@${version}"

            # Backstop for floors the ordering guard cannot see: with that guard in place, a no-diff add means the lookup missed main's spec for this package (a dependency table or range form it does not read), not that the bump is stale.
            if git diff --quiet -- package.json pnpm-lock.yaml; then
              echo "add produced no diff -- main's spec for ${package} was not recognised by the floor lookup. Nothing left to bump."
              git push origin --delete "$branch" || echo "::warning::could not delete stale branch ${branch} on origin"
              return 0
            fi

            git add package.json pnpm-lock.yaml
            git commit -m "build(deps): bump ${package} to ${version}"
            git push --force origin "$branch"

            local pr_url
            if ! pr_url=$(gh pr create --title "build(deps): bump ${package} to ${version}" \
              --body "Regenerated automatically after the original PR fell behind main." \
              --base main --head "$branch" 2>&1); then
              # A PR for this exact branch can already exist if a concurrent dispatch (a fresh publish, or another heal-stranded-prs run) recreated it between this loop reading its candidate list and this iteration reaching gh pr create. The push above already landed on the branch either way, so reuse whatever PR now points at it instead of treating this as fatal.
              local existing
              existing=$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // empty')
              if [ -z "$existing" ]; then
                echo "::warning::gh pr create failed for ${branch} and no existing open PR was found: ${pr_url}"
                return 1
              fi
              echo "PR for ${branch} already exists -- reusing ${existing} instead of creating a new one."
              pr_url="$existing"
            fi

            local head_sha
            head_sha=$(git rev-parse HEAD)
            wait_and_merge "$pr_url" "$head_sha" "$branch"
          }

          candidates=$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("sibling-update/"))] | .[]')
          if [ -z "$candidates" ]; then
            echo "No open sibling-update PRs found."
            exit 0
          fi

          echo "$candidates" | jq -c '.' | while read -r entry; do
            number=$(echo "$entry" | jq -r '.number')
            branch=$(echo "$entry" | jq -r '.headRefName')
            if ! regenerate_pr "$number" "$branch"; then
              echo "::warning::Failed to regenerate PR #${number} (${branch}) -- continuing with the rest of the batch."
            fi
          done
